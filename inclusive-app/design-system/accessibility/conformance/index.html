\",\"h1\",null,{\"className\":\"text-foreground text-3xl font-bold sm:text-4xl\",\"children\":\"Accessibility Conformance Statement\"}],[\"$\",\"p\",null,{\"className\":\"text-foreground-muted leading-relaxed\",\"children\":[\"The Inclusive Design System and ATS demo are\",\" \",[\"$\",\"strong\",null,{\"className\":\"text-foreground font-semibold\",\"children\":\"WCAG 2.2 AA conformant, with four Level AAA criteria enforced in CI\"}],\" \",\"across every route, in both themes, at desktop and mobile widths. This page records the scope, method and date of that claim, what the method does not cover, and the Level AAA criteria carried as exceptions.\"]}],[\"$\",\"p\",null,{\"className\":\"text-foreground-muted text-sm leading-relaxed\",\"children\":[\"Of the 31 Level AAA success criteria in WCAG 2.2, 28 are met, enforced or not applicable. Three are exempted with a reason: 3.1.5 Reading Level, 2.5.5 Target Size (Enhanced) and 1.3.6 Identify Purpose. That is\",\" \",\"$L1b\",\" \",\"and is not presented as one: conformance at AAA requires satisfying every applicable criterion, and W3C does not recommend AAA as a site-wide target because some content cannot satisfy all of it.\"]}],\"$L1c\"]}],\"$L1d\",\"$L1e\",\"$L1f\",\"$L20\",\"$L21\",\"$L22\",\"$L23\"]}]}],null,\"$L24\"]}]\nb:[\"$\",\"$2\",\"h\",{\"children\":[null,[\"$\",\"$L25\",null,{\"children\":\"$L26\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L27\",null,{\"children\":[\"$\",\"$28\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L29\"}]}]}],null]}]\n48:I[30887,[],\"OutletBoundary\"]\na:C\n1b:[\"$\",\"strong\",null,{\"className\":\"text-foreground\",\"children\":\"not a Level AAA conformance claim\"}]\n1c:[\"$\",\"p\",null,{\"className\":\"text-foreground-muted text-sm\",\"children\":[\"Statement date: \",[\"$\",\"time\",null,{\"dateTime\":\"2026-08-04\",\"children\":\"4 August 2026\"}]]}]\n1d:[\"$\",\"section\",null,{\"className\":\"space-y-3\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-foreground text-xl font-semibold\",\"children\":\"Scope\"}],[\"$\",\"div\",null,{\"className\":\"border-border text-foreground-muted space-y-3 rounded-2xl border bg-[hsl(var(--card))] p-6 text-sm leading-relaxed\",\"children\":[[\"$\",\"p\",null,{\"children\":[\"This statement covers the public documentation site, design-system catalogue, and live ATS demo hosted at\",\" \",[\"$\",\"a\",null,{\"href\":\"https://craighawkes.dev/inclusive-app\",\"className\":\"inline-flex items-center gap-1 text-[hsl(var(--primary-text))] underline\",\"children\":[\"inclusive-v2.vercel.app\",[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":\"1em\",\"height\":\"1em\",\"fill\":\"currentColor\",\"viewBox\":\"0 0 256 256\",\"transform\":\"$undefined\",\"className\":\"h-3.5 w-3.5\",\"aria-hidden\":\"true\",\"children\":[false,\"$undefined\",[\"$\",\"path\",null,{\"d\":\"M224,104a8,8,0,0,1-16,0V59.32l-66.33,66.34a8,8,0,0,1-11.32-11.32L196.68,48H152a8,8,0,0,1,0-16h64a8,8,0,0,1,8,8Zm-40,24a8,8,0,0,0-8,8v72H48V80h72a8,8,0,0,0,0-16H48A16,16,0,0,0,32,80V208a16,16,0,0,0,16,16H176a16,16,0,0,0,16-16V136A8,8,0,0,0,184,128Z\"}]]}]]}],\", including all routes under\",\" \",[\"$\",\"code\",null,{\"className\":\"text-foreground\",\"children\":\"/design-system\"}],\" and\",\" \",[\"$\",\"code\",null,{\"className\":\"text-foreground\",\"children\":\"/(ats)\"}],\".\"]}],[\"$\",\"p\",null,{\"children\":[\"The \",[\"$\",\"code\",null,{\"className\":\"text-foreground\",\"children\":\"@inclusive/react\"}],\" \",\"component library is evaluated through its documented demos and Storybook stories; third-party consumer applications are out of scope unless they adopt the packaged accessibility settings.\"]}]]}]]}]\n1e:[\"$\",\"section\",null,{\"className\":\"space-y-3\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-foreground text-xl font-semibold\",\"children\":\"Conformance target\"}],[\"$\",\"div\",null,{\"className\":\"border-border text-foreground-muted rounded-2xl border bg-[hsl(var(--card))] p-6 text-sm leading-relaxed\",\"children\":[\"$\",\"ul\",null,{\"className\":\"list-disc space-y-2 ps-5\",\"children\":[[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"className\":\"text-foreground\",\"children\":\"Enforced:\"}],\" WCAG 2.2 Level AA (axe-core tags wcag2a, wcag2aa, wcag21a, wcag21aa, wcag22aa) across \",[\"$\",\"em\",null,{\"children\":\"every\"}],\" route in dark and light themes, at desktop and mobile viewports. The route list is generated from the filesystem, so a new page is scanned as soon as it exists.\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"className\":\"text-foreground\",\"children\":\"Viewports and browsers:\"}],\" \",\"Chromium, WebKit and a Pixel 5 viewport in CI; Firefox additionally in local runs. Mobile was added on 8 August 2026, and adding it found a defect that desktop-only testing could not: 266 scrollable regions — code samples, wide tables, tab strips — that could be scrolled with a mouse but not with a keyboard, failing\",\" \",[\"$\",\"strong\",null,{\"className\":\"text-foreground\",\"children\":\"2.1.1 Keyboard, Level A\"}],\" \",\"on 270 of 354 route/theme combinations. The rule cannot fire on a wide screen, because nothing overflows there. It is fixed, and the mobile viewport now gates every build so it cannot return.\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"className\":\"text-foreground\",\"children\":\"Enforced at AAA:\"}],\" \",\"four criteria have their own CI gate. 1.4.6 Contrast (Enhanced) is verified by\",\" \",[\"$\",\"code\",null,{\"className\":\"text-foreground\",\"children\":\"npm run contrast:check\"}],\", which computes 360 sanctioned token pairings across four themes with alpha compositing, at 7:1 for text and 3:1 for non-text. That gate — not axe — is the authority on contrast here: every colour resolves through \",[\"$\",\"code\",null,{\"children\":\"oklch()\"}],\", and browsers return the unresolved \",[\"$\",\"code\",null,{\"children\":\"oklch()\"}],\" string from\",\" \",[\"$\",\"code\",null,{\"children\":\"getComputedStyle\"}],\", so axe has to resolve it and intermittently gets it wrong. Computing from the token source is both stricter and deterministic. The consequence, stated plainly: a colour that does \",[\"$\",\"em\",null,{\"children\":\"not\"}],\" come from the token layer — a third-party embed, an inline style — is not contrast-checked at runtime. 1.4.8 Visual Presentation, 2.4.9 Link Purpose and 2.4.12 Focus Not Obscured each have a dedicated e2e spec covering every route. All fail CI on regression.\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"className\":\"text-foreground\",\"children\":\"Remaining AAA criteria:\"}],\" \",\"assessed individually and published in the register below. Each is marked enforced, met, not applicable, or exempted with a reason — never simply “targeted”. Nothing is outstanding.\"]}]]}]}]]}]\n1f:[\"$\",\"section\",null,{\"className\":\"space-y-3\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-foreground text-xl font-semibold\",\"children\":\"Evaluation method\"}],[\"$\",\"div\",null,{\"className\":\"border-border text-foreground-muted space-y-3 rounded-2xl border bg-[hsl(var(--card))] p-6 text-sm leading-relaxed\",\"children\":[[\"$\",\"p\",null,{\"children\":\"Testing combines automated and manual techniques:\"}],[\"$\",\"ol\",null,{\"className\":\"list-decimal space-y-2 ps-5\",\"children\":[[\"$\",\"li\",null,{\"children\":\"Production build scanned with axe-core (Playwright) across every route × dark/light themes, at both AA and AAA tag sets. The route list is generated from the filesystem rather than hand-maintained, so coverage cannot silently drift.\"}],[\"$\",\"li\",null,{\"children\":[\"Token contrast computed from source with alpha compositing —\",\" \",[\"$\",\"code\",null,{\"className\":\"text-foreground\",\"children\":\"npm run contrast:check\"}],\" \",\"— covering 360 sanctioned pairi
